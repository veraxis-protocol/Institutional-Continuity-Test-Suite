name: test

# The core conformance gate must never depend on an optional harness, a network
# install, or a third-party package. It is bare Python over frozen inputs.
#
# The H1 gate is separate and does take a pinned dependency, but it is no longer
# advisory: as of ICTS_H1_INSPECT_v0.1.1 it is a required-success job.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: conformance (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show environment
        run: |
          python --version
          python -c "import sys; print(sys.implementation.name)"

      # Fails on manifest/input integrity failure, provenance failure, mapper
      # conformance failure, or any fixture/result mismatch. This verifies all 42
      # frozen manifest hashes and then runs the unmodified frozen run_suite.py
      # inside a reconstituted frozen package.
      - name: Frozen package integrity and conformance suite
        run: python scripts/verify_frozen_package.py

      # Fails on any adversarial regression failure.
      - name: Adversarial regression suite
        run: python reference/bare_python/run_adversarial_regression.py

      - name: Assert no generated evidence was committed
        run: |
          if git ls-files --error-unmatch evidence/run_result.json >/dev/null 2>&1; then
            echo "::error::Generated run evidence must not be committed"
            exit 1
          fi
          echo "OK: no generated run evidence committed"

      - name: Assert no bytecode or cache artifacts were committed
        run: |
          found=$(git ls-files | grep -E '(^|/)__pycache__/|\.py[co]$' || true)
          if [ -n "$found" ]; then
            echo "::error::Bytecode or cache artifacts are committed:"
            echo "$found"
            exit 1
          fi
          echo "OK: no bytecode or cache artifacts committed"

  # H1 harness-independence gate.
  #
  # Supported H1 matrix: Python 3.11 and 3.12. The bare-Python core keeps its
  # broader 3.9-3.12 matrix; H1 is not forced onto a Python version unsupported
  # by the Inspect dependency chain merely to match it.
  #
  # This job is a REQUIRED SUCCESS gate. It is deliberately NOT
  # continue-on-error: ICTS_H1_INSPECT_v0.1.0 failed silently as an advisory
  # job, which is how the defect survived.
  h1:
    name: H1 harness independence (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: conformance
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned Inspect AI
        run: python -m pip install inspect-ai==0.3.263

      - name: Verify the pin matches INSPECT_PIN.json
        run: |
          python - <<'PY'
          import importlib.metadata, json, pathlib
          pin = json.loads(pathlib.Path("reference/inspect_ai/INSPECT_PIN.json").read_text())
          installed = importlib.metadata.version("inspect-ai")
          print(f"pinned:    {pin['package']}=={pin['version']}")
          print(f"installed: inspect-ai=={installed}")
          if installed != pin["version"]:
              raise SystemExit(f"pin mismatch: expected {pin['version']}, got {installed}")
          PY

      # run_h1.py verifies frozen v0.1.2 integrity, runs the bare-Python
      # baseline, runs the independent Inspect implementation, and compares all
      # 14 frozen cases one by one. It exits non-zero on any difference, and
      # reports H1_NOT_EXECUTED rather than a pass if it cannot run.
      - name: Run H1 gate
        run: python reference/inspect_ai/run_h1.py --frozen-tree . --output "$RUNNER_TEMP/H1_RESULT.json" --independence-output "$RUNNER_TEMP/H1_INDEPENDENCE_RECORD.json"

      - name: Assert H1 terminal, independence, and full case coverage
        run: |
          python - <<'PY'
          import json, os, pathlib
          result = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "H1_RESULT.json").read_text())

          assert result["terminal"] == "H1_PASS", f"terminal was {result['terminal']}"
          assert result["cases_total"] == 14, f"expected 14 cases, got {result['cases_total']}"
          assert result["cases_equivalent"] == 14, (
              f"only {result['cases_equivalent']}/{result['cases_total']} equivalent"
          )

          # Case-by-case, never aggregate-only.
          for c in result["comparisons"]:
              assert c["equivalent"], (
                  f"{c['case_id']}: expected={c['expected']} "
                  f"bare={c['bare_python_result']} inspect={c['inspect_ai_result']}"
              )

          ind = result["independence_check"]
          assert ind["independent"], "Inspect harness is not independent"
          assert ind["inspect_imports_bare_python"] is False
          assert ind["independent_normalization"]
          assert ind["independent_evidence_sufficiency"]
          assert ind["independent_invariant_adjudication"]

          assert result["normative_manifest_sha256"] == (
              "920d390714cc9593cf0a79c1caf80f2566419e2fa05d6e12cb9c403b20f0040f"
          )
          print("OK: H1_PASS, 14/14 equivalent, independence confirmed")
          print(f"    normative_comparison_sha256 {result['normative_comparison_sha256']}")
          PY

      # The committed evidence must reflect what the gate actually produces.
      # The normative portion carries no timestamps or environment data, so it
      # is stable across machines and is compared digest-to-digest.
      - name: Assert committed evidence matches this run
        run: |
          python - <<'PY'
          import json, os, pathlib
          fresh = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "H1_RESULT.json").read_text())
          committed = json.loads(pathlib.Path("reference/inspect_ai/H1_RESULT.json").read_text())
          if fresh["normative_comparison_sha256"] != committed["normative_comparison_sha256"]:
              raise SystemExit(
                  "committed H1 evidence is stale:\n"
                  f"  committed {committed['normative_comparison_sha256']}\n"
                  f"  observed  {fresh['normative_comparison_sha256']}"
              )
          print("OK: committed H1 evidence matches this run")
          PY

      - name: Upload H1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h1-evidence-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/H1_RESULT.json
            ${{ runner.temp }}/H1_INDEPENDENCE_RECORD.json
          if-no-files-found: warn
